version: "3.7"

services:
    app_proxy:
        environment:
            APP_HOST: miniharri-store-kapowarr_server_1
            APP_PORT: 5656

    server:
        image: mrcas/kapowarr:latest
        init: true
        volumes:
            - ${APP_DATA_DIR}/data/db:/app/db
            - ${APP_DATA_DIR}/data/temp_downloads:/app/temp_downloads
